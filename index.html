<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7490" />
    <meta
      name="description"
      content="بهینه‌سازی برش دوبعدی ورق — داشبورد تنظیمات و تم، نقشهٔ برش و لیبل‌ها، خروجی DXF/PDF. رابط چهارصفحه‌ای مستقل، نصب‌پذیر و آفلاین."
    />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>داشبورد برش ورق | نقشه، لیبل و خروجی</title>
    <script>
      // اعمال تم قبل از اولین رنگ‌آمیزی صفحه (جلوگیری از فلش سفید در دارک‌مود)
      (function () {
        try {
          var saved = localStorage.getItem('acut_theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

          // تنظیمات ظاهری (رنگ تأکید، نوار بالا، گوشه‌ها، انیمیشن) قبل از رندر
          var prefs = localStorage.getItem('acut_ui_prefs');
          if (prefs) {
            var p = JSON.parse(prefs) || {};
            var root = document.documentElement;
            if (p.accent) root.dataset.accent = p.accent;
            if (p.header) root.dataset.header = p.header;
            if (p.corners) root.dataset.corners = p.corners;
            if (p.motion) root.dataset.motion = p.motion;
            if (typeof p.ring === 'boolean') root.dataset.ring = p.ring ? 'on' : 'off';
          }
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
