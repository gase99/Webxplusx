name: Build Android APK

# ساخت APK دیباگ بدون نیاز به Android Studio روی سیستم شما:
#   • دستی: GitHub → Actions → Build Android APK → Run workflow
#   • خودکار: هر تغییری در فایل‌های مرتبط با نسخهٔ بومی روی main،
#     و همچنین پوش تگ نسخه (v*)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/android-apk.mjs'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # پکیج قدیمی `tools` از مخازن گوگل حذف شده است و مقدار پیش‌فرض این اکشن
      # همان `tools platform-tools` است؛ به همین دلیل فقط platform-tools را
      # صریحاً نصب می‌کنیم تا مرحله هرگز روی پکیج منسوخ شکست نخورد.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # نصب قطعی قطعات موردنیاز پروژه (compileSdk/targetSdk = 36، AGP 8.13).
      # اگر پکیجی در این نسخه در دسترس نباشد، Gradle خودش هنگام بیلد آن را
      # دانلود می‌کند؛ بنابراین این مرحله هرگز باعث شکست ورک‌فلو نمی‌شود.
      - name: Install Android SDK platform and build-tools
        run: |
          set +e
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::نصب صریح پکیج‌های SDK انجام نشد؛ Gradle هنگام بیلد خودش آن‌ها را دانلود می‌کند."
          fi
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" 2>/dev/null || true
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (native base)
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a-cut-2dpro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
