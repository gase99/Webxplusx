name: Build Android APK

# ساخت APK دیباگ؛ هر تغییر مؤثر در برنامهٔ وب/بومی روی main نیز APK تازه می‌سازد.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK platform and build-tools
        run: |
          set +e
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::نصب صریح پکیج‌های SDK انجام نشد؛ Gradle هنگام بیلد خودش آن‌ها را دانلود می‌کند."
          fi
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" 2>/dev/null || true
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (native base)
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a-cut-2dpro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
