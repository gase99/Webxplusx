name: Build Windows Installer (NSIS)

# اجرای دستی یا ساخت خودکار پس از تغییر کد برنامه روی main.
# انتشار GitHub Release فقط با push تگ نسخه (v*) انجام می‌شود.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/windows-exe.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (native base)
        run: npm run build:app

      - name: Copy web bundle into desktop package
        run: node desktop/prepare.mjs

      - name: Install Electron dependencies
        run: npm --prefix desktop install

      - name: Build NSIS installer (+ latest.yml for auto-update)
        run: npm --prefix desktop run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer + update metadata
        uses: actions/upload-artifact@v4
        with:
          name: a-cut-2dpro-windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

      # انتشار رسمی فقط برای تگ نسخه؛ اجرای معمولی main صرفاً artifact می‌سازد.
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: A-Cut 2Dpro ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
